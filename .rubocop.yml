---
plugins:
  - rubocop-rspec
  - rubocop-rake

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.2

Metrics/MethodLength:
  Enabled: 50

RSpec/MultipleExpectations:
  Enabled: false

RSpec/ExampleLength:
  Enabled: 25

RSpec/MultipleMemoizedHelpers:
  Enabled: 10

Layout/LineLength:
  Enabled: 160

RSpec/Dialect:
  PreferredMethods:
    background: :before
    scenario: :it
    xscenario: :xit
    given: :let
    given!: :let!
    feature: :describe

# The adapter mirrors the layout of the upstream Semian adapters: the pg error
# classes are patched next to the Semian::PG module in a single file, and the
# Semian error subclasses are declared with Class.new.
Style/OneClassPerFile:
  Enabled: false

Style/EmptyClassDefinition:
  Enabled: false

# The integration specs describe the adapter underneath a consumer rather than
# a class, and set up one connection pool and table for the whole suite.
RSpec/DescribeClass:
  IgnoredMetadata:
    type:
      - integration

RSpec/BeforeAfterAll:
  Exclude:
    - spec/integration/**/*
